name: CI
on:
  push:
  pull_request:

# Runner image pinned so an ubuntu-latest move (to 26.04) cannot change CI unexpectedly.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # GitHub runners have no GPU: loading the full 3D model in software rendering
      # takes too long, so tests tagged @3d run locally only (npm run test:e2e).
      - run: npm run test:e2e:ci
        timeout-minutes: 15
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
