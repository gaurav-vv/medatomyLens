name: Deploy to GitHub Pages
# Free static hosting. Enable once in the repo: Settings → Pages → Source: GitHub Actions.
# The site is served from https://<user>.github.io/<repo>/, so the build uses that sub-path.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Chat Worker address (Settings → Secrets and variables → Actions → Variables → CHAT_URL). Empty = chat off.
          NEXT_PUBLIC_CHAT_URL: ${{ vars.CHAT_URL }}
      # Serve files starting with "_" (Next's _next/ folder) as-is.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
