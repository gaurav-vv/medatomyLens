name: Deploy to GitHub Pages
# Free static hosting. Enable once in the repo: Settings → Pages → Source: GitHub Actions.
# The site is served from https://<user>.github.io/<repo>/, so the build uses that sub-path.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Runner image pinned so an ubuntu-latest move (to 26.04) cannot change CI unexpectedly.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Chat Worker address (public, not a secret; see README "AI chat").
          NEXT_PUBLIC_CHAT_URL: https://anatomylens-chat.gaurav-vv.workers.dev
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
