# AnatomyLens chat Worker. Deploy: npm run worker:deploy (see README "AI chat").
name = "anatomylens-chat"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Workers AI: free allowance of 10,000 Neurons per day (resets 00:00 UTC).
[ai]
binding = "AI"

# 10 questions per minute per visitor IP (period must be 10 or 60 seconds).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
# Origins only (no path). Add your own domain here if you host the app elsewhere.
ALLOWED_ORIGINS = "https://gaurav-vv.github.io,http://localhost:3000,http://localhost:4173"
MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"

# No logs of requests (they contain the user's question).
[observability]
enabled = false
